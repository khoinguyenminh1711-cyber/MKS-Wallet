    <script>
      (function() {
        window.addEventListener('unhandledrejection', function(event) {
          var reasonStr = (event.reason && (event.reason.message || event.reason.stack || event.reason)) || '';
          if (typeof reasonStr === 'string' && (reasonStr.includes('WebSocket') || reasonStr.includes('websocket'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
        var origConsoleError = console.error;
        console.error = function() {
          var first = arguments[0];
          if (typeof first === 'string' && (first.includes('[vite] failed to connect to websocket') || first.includes('WebSocket closed without opened'))) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>
